[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--html=reports/report.html",
    "--self-contained-html",
    "--alluredir=reports/allure-results",
    "-v",
]
markers = [
    "smoke: quick sanity checks",
    "regression: full regression suite",
    "e2e: end-to-end UI tests",
    "api: API-level tests",
    "slow: tests that take longer than usual",
    "performance: performance and load time tests",
]
timeout = 60

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function call in default argument
    "SIM108", # ternary operator — readability preference
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # allow assert in tests

[tool.ruff.lint.isort]
known-first-party = ["config", "pages", "utils", "fixtures"]

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_generics = false
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["faker.*", "allure.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["pages", "utils", "config", "fixtures"]
omit = ["tests/*", "*/__init__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0          # raise once a baseline is established
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
